name: Apply ball visibility fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ball-visibility.yml

permissions:
  contents: write

jobs:
  patch-game:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hide the ball at the plate
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text()
          old = "function draw(now){let w=V.w,h=V.h;if(!w)return;x.clearRect(0,0,w,h);stadium(w,h);field(w,h);people(w,h);zone();if(G.p){if(G.state==='pitching'){let t=Math.min(1,(now-G.start)/M[G.mode].time),e=1-Math.pow(1-t,2.2);G.p.progress=e;G.p.pos=q(G.p.from,G.p.ctrl,G.p.tar,e);if(t>=1)arrived()}trail();baseball(G.p.pos.x,G.p.pos.y,G.p.r,G.p.progress)}particles();requestAnimationFrame(draw)}"
          new = "function draw(now){let w=V.w,h=V.h;if(!w)return;x.clearRect(0,0,w,h);stadium(w,h);field(w,h);people(w,h);zone();if(G.p&&G.state==='pitching'){let t=Math.min(1,(now-G.start)/M[G.mode].time),e=1-Math.pow(1-t,2.2);G.p.progress=e;G.p.pos=q(G.p.from,G.p.ctrl,G.p.tar,e);if(t>=1)arrived();else{trail();baseball(G.p.pos.x,G.p.pos.y,G.p.r,G.p.progress)}}particles();requestAnimationFrame(draw)}"
          if old not in content:
              raise SystemExit("Expected draw function was not found")
          path.write_text(content.replace(old, new, 1))

      - name: Verify the change
        run: |
          grep -F "if(G.p&&G.state==='pitching')" index.html
          grep -F "if(t>=1)arrived();else{trail();baseball" index.html

      - name: Commit the fix
        run: |
          git config user.name "BaseballBlast Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-ball-visibility.yml
          git add index.html
          git commit -m "Hide pitch after it reaches the plate"
          git push
